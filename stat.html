<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Статистика</title>
    <link rel="icon" type="image/png" href="images/world-cup.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Дополнительные стили для stat.html */
        .stat-container {
            max-width: 980px;
            margin: 0 auto;
            height: 96vh;
            display: flex;
            flex-direction: column;
        }
        
        .stat-subtitle {
            font-size: 0.85rem;
            color: #666;
            margin: 0 0 4px 0;
            text-align: left;
            flex-shrink: 0;
        }
        
        .stat-tabs {
            display: flex;
            gap: 0;
            margin: 4px 0 12px 0;
            border-bottom: 2px solid #dde8c0;
            flex-shrink: 0;
        }
        
        .stat-tab {
            padding: 8px 24px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c5a2a;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
            margin-bottom: -2px;
        }
        
        .stat-tab:hover {
            background: #e9e6cf;
        }
        
        .stat-tab.active {
            border-bottom-color: #2c7840;
            color: #1e4620;
            font-weight: 600;
        }
        
        #statContent {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        
        .stat-tab-content {
            display: none;
            padding: 12px 0;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }
        
        .stat-tab-content.active {
            display: block;
        }
        
        .stat-nomination {
            background: #f8f7f0;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 14px;
            border-left: 4px solid #8ba88a;
        }
        
        .stat-nomination h3 {
            margin: 0 0 3px 0;
            color: #1e4620;
            font-size: 1rem;
        }
        
        .stat-nomination .explanation {
            font-size: 0.78rem;
            color: #888;
            margin: 0 0 6px 0;
            font-style: italic;
        }
        
        .stat-nomination .winners {
            font-size: 0.92rem;
            font-weight: 500;
            color: #1e4620;
            word-wrap: break-word;
        }
        
        .stat-nomination .winners strong {
            color: #2c7840;
        }
        
        .stat-nomination .value {
            font-size: 0.82rem;
            color: #666;
            margin-top: 2px;
        }
        
        .stat-nomination .value strong {
            color: #2c5a2a;
        }
        
        .stat-nomination-empty {
            color: #999;
            font-style: italic;
            padding: 20px;
            text-align: center;
        }

        .btn-back-table {
            background: #f1c40f;
            color: #2c3e2f;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 500;
            line-height: 1.4;
            cursor: pointer;
            border: none;
        }
        
        .btn-back-table:hover {
            background: #e67e22;
            transform: translateY(-1px);
        }

	.stat-nomination .winners,
	.stat-nomination .value {
	    padding-left: 20px;
	}

    </style>
</head>
<body>
<div class="container stat-container">
    <div class="fill-header">
        <div class="fill-header__title">
            <h1><span id="logoContainer"></span>Статистика</h1>
            <div class="sub"></div>
        </div>
        <div class="index-actions">
            <div class="index-actions__row index-actions__buttons">
                <a href="index.html" class="btn-back-table">Назад к таблице</a>
                <a href="battle.html" class="btn-battle active">Ход борьбы</a>
            </div>
        </div>
    </div>

    <div id="statSubtitle" class="stat-subtitle">⏳ Загрузка статистики...</div>

    <div class="stat-tabs">
        <button class="stat-tab active" data-tab="matches">Матчи</button>
        <button class="stat-tab" data-tab="participants">Участники</button>
    </div>

    <div id="statContent">
        <div class="stat-tab-content active" id="tab-matches">
            <div id="matchesStats"></div>
        </div>
        <div class="stat-tab-content" id="tab-participants">
            <div id="participantsStats"></div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="stat.js"></script>
</body>
</html>
